<!doctype html>
<html lang="zh-CN">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>员工工作台 · 拾光书店</title>
<main>
  <h1>员工工作台</h1>
  <p>{{ actor.name }}，当前岗位：{{ actor.role }}</p>
  {% if actor.role == '收银员' %}<p><a href="{{ url_for('sale_form') }}">办理门店销售</a></p>{% endif %}
  <form method="post" action="{{ url_for('logout') }}">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <button type="submit">退出登录</button>
  </form>
</main>
</html>
