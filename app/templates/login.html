{% extends 'base.html' %}
{% block title %}员工登录{% endblock %}
{% block content %}
<section class="panel login-panel">
  <p class="eyebrow">拾光 · 门店服务</p>
  <h1>拾光书店员工登录</h1>
  {% if error %}<p role="alert">{{ error }}</p>{% endif %}
  <p class="muted">使用员工账号登录，进入对应岗位的工作台。</p>
  <form method="post" action="{{ url_for('auth.login') }}" data-submit-once>
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <p><label>员工账号 <input name="phone" type="tel" pattern="[0-9]{11}" maxlength="11" autocomplete="username" required></label></p>
    <p><label>密码 <input name="password" type="password" maxlength="256" autocomplete="current-password" required></label></p>
    <button type="submit">登录</button>
  </form>

</section>
{% endblock %}
