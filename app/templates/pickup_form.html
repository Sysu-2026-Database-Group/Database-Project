{% extends 'base.html' %}{% block title %}预订核验与取货{% endblock %}{% block content %}<h1>预订核验与取货</h1><section class="panel"><form method="post" action="{{ url_for('reservations.pickup_preview') }}"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><input type="hidden" name="request_key" value="{{ request_key }}"><label>预订手机号<input name="phone" maxlength="11" required></label><label>预定码<input name="code" maxlength="20" required></label><label>会员手机号（非会员留空）<input name="member_phone" maxlength="11"></label><label>使用积分<input name="used_points" type="number" min="0" value="0"></label><button>核验并预览整单收款</button><button formaction="{{ url_for('reservations.cashier_cancel') }}" class="secondary">确认代取消整单预订</button></form></section>{% endblock %}
